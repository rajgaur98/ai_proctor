[package]
name = "agent-platform"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Platform implementations: macOS (objc2) and Windows (windows-rs)"

[dependencies]
agent-core.workspace = true
tracing.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# The Windows input guard (ANT-02): a low-level mouse hook on its own thread.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "libc", "HIServices", "AXError", "AXUIElement"] }
objc2-av-foundation = "0.3"
objc2-core-audio = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-media-io = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-user-notifications = "0.3"
