[package]
name = "agent-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Platform-independent agent logic: contracts, the Platform trait, status, logging"

[features]
# Exposes FakePlatform outside this crate's own tests.
fake = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
typify = "0.6"

[dev-dependencies]
tempfile = "3"
