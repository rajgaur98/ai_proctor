[package]
name = "ai-proctor-agent"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "AI Proctor desktop agent"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-core.workspace = true
agent-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri-plugin-deep-link = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }
fastrand = "2"

# The check-in card as a non-activating NSPanel (spike #11).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"

# Windows and Linux start a second process for an aiproctor:// link; this hands the
# link to the running agent instead (macOS delivers it to the running app itself).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
agent-core = { workspace = true, features = ["fake"] }
tempfile = "3"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }

[lib]
name = "ai_proctor_agent"
path = "src/lib.rs"

# tauri-plugin-deep-link 2.6.2's Linux code builds `ini::ParseOption` with two
# fields; rust-ini 0.21.2+ added more, which breaks it. Drop when the plugin moves on.
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"
