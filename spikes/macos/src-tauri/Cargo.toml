# Throwaway spike app for #11 / #13 / #14 (macOS). Not part of any workspace.
[package]
name = "ai-proctor-spike-macos"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-nspanel = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPanel", "NSResponder", "NSRunningApplication", "NSWindow", "NSWorkspace"] }
