# Throwaway spike app for #11 / #13 / #14 (macOS). Not part of any workspace.
[package]
name = "ai-proctor-spike-macos"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-nspanel = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-av-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
image = { version = "0.25", default-features = false }
fast_image_resize = "6"
webp = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPanel", "NSResponder", "NSRunningApplication", "NSWindow", "NSWorkspace"] }

# Dependencies (libwebp, resize) optimized even in dev builds, so timings are realistic.
[profile.dev.package."*"]
opt-level = 3
