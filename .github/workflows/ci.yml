name: CI

# Linux jobs run on every PR, including PRs stacked on other feature branches.
# Windows runs on PRs that touch agent Rust code; macOS and Windows both run on the
# `ci:full` label and nightly (they cost 10x and 2x the free minutes).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # On pull_request events paths-filter lists changed files through the API, so no
    # checkout is needed.
    permissions:
      pull-requests: read
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      sync: ${{ steps.filter.outputs.sync }}
      web: ${{ steps.filter.outputs.web }}
      functions: ${{ steps.filter.outputs.functions }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            windows:
              - "**/windows/**"
              - "**/*windows*.rs"
              # Any agent Rust can stop compiling on Windows (cfg-gated code, dead code).
              - "apps/agent/src-tauri/**/*.rs"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
            web:
              - "apps/web/**"
              - "packages/**"
              - "supabase/**"
              - "pnpm-lock.yaml"
              - ".github/workflows/ci.yml"
            functions:
              - "supabase/functions/**"
              - ".github/workflows/ci.yml"
            sync:
              - "apps/agent/src-tauri/core/**"
              - "apps/agent/src-tauri/src/**"
              - "apps/agent/src-tauri/tests/**"
              - "supabase/**"
              - "packages/contracts/**"
              - "Cargo.lock"
              - ".github/workflows/ci.yml"

  js:
    name: Lint, typecheck, test (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: IPC JSON Schema is up to date with the Zod contracts
        run: |
          pnpm contracts:gen
          git diff --exit-code packages/contracts/generated
      - name: SQL status vectors are generated from packages/core/vectors
        run: |
          pnpm core:gen
          git diff --exit-code supabase/tests/database/status_vectors.test.sql
      - name: Edge Function copy of packages/core is up to date
        run: pnpm core:fn --check

  rust:
    name: Rust fmt, clippy, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tauri embeds the popover's built assets at compile time.
      - run: pnpm --filter @ai-proctor/agent build
      - uses: Swatinem/rust-cache@v2
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  db:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Postgres only: applies migrations and seed, which is all pgTAP needs.
      - run: pnpm supabase db start
      - run: pnpm db:test
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code packages/contracts/src/database.types.ts
      - name: Agent-event schema in the database matches packages/contracts
        run: pnpm contracts:check-db

  # The agent's sync client against a real local Supabase (Auth, PostgREST,
  # Storage). Only when the agent core, the database or the contracts change.
  sync-it:
    name: Sync integration (agent ↔ Supabase)
    needs: changes
    if: >-
      always() && needs.changes.result != 'failure' && (
      github.event_name != 'pull_request' || needs.changes.outputs.sync == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start -x studio,imgproxy,edge-runtime,realtime,postgres-meta,supavisor
      - uses: Swatinem/rust-cache@v2
      # Mailpit (the stack's mail catcher) delivers the magic links for sign-in.
      - name: cargo test (sync, magic-link sign-in, account)
        run: |
          eval "$(pnpm --silent supabase status -o env | grep -E '^(API_URL|ANON_KEY|MAILPIT_URL)=')"
          export AI_PROCTOR_SUPABASE_URL="$API_URL" AI_PROCTOR_SUPABASE_ANON_KEY="$ANON_KEY" AI_PROCTOR_MAILPIT_URL="$MAILPIT_URL"
          cargo test -p agent-core --locked --test sync_supabase --test auth_supabase -- --nocapture
          cargo test -p ai-proctor-agent --locked --test sign_in_supabase -- --nocapture

  # Dashboard smoke test with axe-core (WCAG 2.1 AA) against a local Supabase.
  web-e2e:
    name: Dashboard smoke + accessibility (Playwright)
    needs: changes
    if: >-
      always() && needs.changes.result != 'failure' && (
      github.event_name != 'pull_request' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Edge runtime on: the invite flow calls the invite-users function.
      - run: pnpm supabase start -x studio,imgproxy,postgres-meta,supavisor
      - name: Point the dashboard at the local stack
        run: |
          eval "$(pnpm --silent supabase status -o env | grep -E '^(API_URL|ANON_KEY|MAILPIT_URL)=')"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > apps/web/.env.local
          echo "MAILPIT_URL=$MAILPIT_URL" >> "$GITHUB_ENV"
      - run: pnpm --filter @ai-proctor/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ai-proctor/web e2e
        env:
          CI: "true"

  # The integration checks (Edge Functions, pg_cron through pg_net, Storage, Mailpit),
  # each on a freshly reset database (#191).
  integration:
    name: Integration checks (functions, cron, storage, email)
    needs: changes
    if: >-
      always() && needs.changes.result != 'failure' && (
      github.event_name != 'pull_request' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase start -x studio,imgproxy,postgres-meta,supavisor
      - run: bash scripts/integration.sh

  # Edge Functions run on Deno, outside the pnpm workspace's tsc.
  deno:
    name: Edge Functions (deno check)
    needs: changes
    if: >-
      always() && needs.changes.result != 'failure' && (
      github.event_name != 'pull_request' || needs.changes.outputs.functions == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.3.1
      # Not the pnpm workspace: no node_modules, and no deno.lock to write.
      - run: deno check --node-modules-dir=none --no-lock supabase/functions/*/index.ts

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # The action lists a PR's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Rust test (Windows)
    needs: changes
    # always(): still run on schedule/dispatch, when the PR-only changes job is skipped.
    if: >-
      always() && needs.changes.result != 'failure' && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.windows == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-proctor/agent build
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  macos:
    name: Rust test (macOS)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-proctor/agent build
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Single required check for branch protection: fails if any job failed or was
  # cancelled; skipped optional jobs (Windows, macOS) are fine.
  ci-ok:
    name: CI OK
    if: always()
    needs: [js, rust, db, sync-it, web-e2e, integration, deno, secrets, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed."
