name: CI

# Linux jobs run on every PR, including PRs stacked on other feature branches.
# Windows runs on PRs that touch Windows code; macOS and Windows both run on the
# `ci:full` label and nightly (they cost 10x and 2x the free minutes).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # On pull_request events paths-filter lists changed files through the API, so no
    # checkout is needed.
    permissions:
      pull-requests: read
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            windows:
              - "**/windows/**"
              - "**/*windows*.rs"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"

  js:
    name: Lint, typecheck, test (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: IPC JSON Schema is up to date with the Zod contracts
        run: |
          pnpm contracts:gen
          git diff --exit-code packages/contracts/generated

  rust:
    name: Rust fmt, clippy, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tauri embeds the popover's built assets at compile time.
      - run: pnpm --filter @ai-proctor/agent build
      - uses: Swatinem/rust-cache@v2
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  db:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Postgres only: applies migrations and seed, which is all pgTAP needs.
      - run: pnpm supabase db start
      - run: pnpm db:test
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code packages/contracts/src/database.types.ts
      - name: Agent-event schema in the database matches packages/contracts
        run: pnpm contracts:check-db

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # The action lists a PR's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Rust test (Windows)
    needs: changes
    # always(): still run on schedule/dispatch, when the PR-only changes job is skipped.
    if: >-
      always() && needs.changes.result != 'failure' && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.windows == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-proctor/agent build
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  macos:
    name: Rust test (macOS)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-proctor/agent build
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Single required check for branch protection: fails if any job failed or was
  # cancelled; skipped optional jobs (Windows, macOS) are fine.
  ci-ok:
    name: CI OK
    if: always()
    needs: [js, rust, db, secrets, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed."
