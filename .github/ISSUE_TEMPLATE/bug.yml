name: Bug
description: Something is broken or behaves differently from the PRD
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [agent, dashboard, backend, infra]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS and version, agent version, browser.
      placeholder: macOS 15.1, agent 0.3.0
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data first.
      render: text
