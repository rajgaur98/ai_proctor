name: Feature
description: A piece of product work, usually tied to PRD requirement IDs
labels: ["type:feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What this delivers and for whom.
    validations:
      required: true
  - type: input
    id: prd
    attributes:
      label: PRD requirements
      description: Requirement IDs from docs/prd/phase-1-presence-and-timesheets.md
      placeholder: CHK-10, CHK-11
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [agent, dashboard, backend, infra]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Design links, open questions, dependencies.
